<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="lobby">

        <button class="button-configs-lobby" id="abrirmodo">
            criar partida
        </button>

        <button class="button-configs-lobby" id="entrar">
            Encontrar partida
        </button>

    </div>


    <div id="modos">

        <button class="button-configs-modos" id="modo-default">
            Normal
        </button>

        <button class="button-configs-modos" id="modo-960">
            960
        </button>

        <button class="button-configs-modos" id="modo-rei">
            rei contente
        </button>

        <button class="button-configs-modos" id="modo-maluco">
            lugar maluco
        </button>

    </div>


    <div id="carregando">

        <div class="spinner"></div>

        <p>Esperando outro jogador...</p>

    </div>


    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

        import {
            getFirestore,
            doc,
            setDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-firestore.js";


        // =========================
        // FIREBASE
        // =========================

        const firebaseConfig = {

            apiKey: "AIzaSyAWsdNWsTgefsADp9iSwp9A3s2OacW-kto",

            authDomain: "bomb-text-9bbf6.firebaseapp.com",

            projectId: "bomb-text-9bbf6",

            storageBucket: "bomb-text-9bbf6.firebasestorage.app",

            messagingSenderId: "364564655193",

            appId: "1:364564655193:web:9df8d93591bf9629371548"

        };


        const app = initializeApp(firebaseConfig);

        const db = getFirestore(app);


        // =========================
        // VARIÁVEIS
        // =========================

        let number = 1;

        let player = false;

        // ID da requisição criada por este jogador
        let minhaRequisicao = null;


        // =========================
        // VERIFICAR PARTIDA
        // =========================

        function verificarPartida() {

            if (player) {

                console.log("Outro jogador encontrado!");

                // Carrega o outro HTML
                window.location.href = "index.html";
            }

        }


        // =========================
        // OBSERVAR LOBBY
        // =========================

        const lobbyRef = doc(db, "lobby", "partidas");


        onSnapshot(lobbyRef, (snapshot) => {

            if (!snapshot.exists()) {
                return;
            }


            const dados = snapshot.data();

            console.log("Lobby atualizado:", dados);


            // Pega todas as requisições existentes
            const requisicoes = Object.keys(dados);


            console.log("Requisições:", requisicoes);


            // Procura uma requisição que não seja a nossa
            const outroJogador = requisicoes.find(
                id => id !== minhaRequisicao
            );


            if (outroJogador) {

                console.log(
                    "Outro jogador encontrado:",
                    outroJogador
                );


                player = true;

                verificarPartida();

            }

        });


        // =========================
        // CRIAR WEBRTC
        // =========================

        async function criar() {

            const peer = new RTCPeerConnection({
                iceServers: [
                    {
                        urls: "stun:stun.l.google.com:19302"
                    }
                ]
            });

            const channel = peer.createDataChannel("chess");

            channel.onopen = () => {
                console.log("Conectado ao adversário!");

                // Guarda que somos o jogador A
                sessionStorage.setItem("jogador", "A");
            };

            channel.onmessage = (event) => {
                const message = JSON.parse(event.data);

                console.log("Recebi:", message);
            };

            const offer = await peer.createOffer();

            await peer.setLocalDescription(offer);

            const pedido = JSON.stringify(peer.localDescription);

            // SALVA NO SESSION STORAGE
            sessionStorage.setItem("webrtc_offer", pedido);

            console.log("OFFER:");
            console.log(pedido);

            return pedido;
        }
        // =========================
        // CRIAR PEDIDO
        // =========================
        async function criarPedido(turno, modo) {

            try {

                const pedido = await criar();

                minhaRequisicao =
                    "requisicao_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8);

                sessionStorage.setItem(
                    "requisicao",
                    minhaRequisicao
                );

                sessionStorage.setItem(
                    "turno",
                    turno
                );

                sessionStorage.setItem(
                    "modo",
                    modo
                );

                const usuarioRef =
                    doc(db, "lobby", "partidas");

                await setDoc(
                    usuarioRef,
                    {
                        [minhaRequisicao]: {
                            turno: turno,
                            json: pedido,
                            modo: modo
                        }
                    },
                    {
                        merge: true
                    }
                );

                // ...

            } catch (error) {

                console.error(
                    "Erro ao atualizar Firestore:",
                    error
                );

            }
        }
        // =========================
        // ENTRAR EM UMA PARTIDA
        // =========================

        async function entrar(offerJSON) {

            const peer =
                new RTCPeerConnection({

                    iceServers: [

                        {
                            urls:
                                "stun:stun.l.google.com:19302"
                        }

                    ]

                });


            peer.ondatachannel = (event) => {

                const channel = event.channel;


                channel.onopen = () => {

                    console.log(
                        "🟢 Conectado ao jogador A!"
                    );

                };


                channel.onmessage = (event) => {

                    const message =
                        JSON.parse(event.data);

                    console.log(
                        "Recebi:",
                        message
                    );

                };

            };


            const offer =
                JSON.parse(offerJSON);


            await peer.setRemoteDescription(
                offer
            );


            const answer =
                await peer.createAnswer();


            await peer.setLocalDescription(
                answer
            );


            console.log("ANSWER:");

            console.log(
                JSON.stringify(peer.localDescription)
            );


            return peer;

        }


        // =========================
        // ABRIR MODOS
        // =========================

        function abrirmodos() {

            console.log(number);


            if (number == 1) {

                document.getElementById("modos")
                    .style.display = "flex";

                number = number - 1;

            }

            else {

                document.getElementById("modos")
                    .style.display = "none";

                number = number + 1;

            }

        }


        // =========================
        // BOTÕES DOS MODOS
        // =========================

        const botoesModo =
            document.querySelectorAll(
                ".button-configs-modos"
            );


        botoesModo.forEach(botao => {

            botao.addEventListener(
                "click",
                () => {

                    const turno =
                        Math.floor(
                            Math.random() * 3
                        ) + 1 === 1
                            ? "branco"
                            : "preto";


                    const modoAtual =
                        botao.id;


                    criarPedido(
                        turno,
                        modoAtual
                    );

                }
            );

        });


        // =========================
        // BOTÃO CRIAR PARTIDA
        // =========================

        document
            .getElementById("abrirmodo")
            .addEventListener(
                "click",
                abrirmodos
            );

    </script>

</body>

</html>
