        let number = 0;
        function viewInterface(i){
            const alvo = document.getElementById("interface")
            if (number === 0){alvo.style.display = "flex"; document.getElementById("button-interface").innerText = "<"; number = 1; number = 1}
            else{alvo.style.display = "none"; document.getElementById("button-interface").innerText = ">"; number = 0}
        }
